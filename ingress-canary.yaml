apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novel-canary-ingress
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "5"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novel-canary-service
                port:
                  number: 80