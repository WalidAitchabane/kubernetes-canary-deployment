apiVersion: apps/v1
kind: Deployment
metadata:
  name: novel-canary
  labels:
    app: novel-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novel-canary
  template:
    metadata:
      labels:
        app: novel-canary
    spec:
      containers:
        - name: novel-canary
          image: blentai/hands-on-k8s-canary:1.4
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "0.25"
            limits:
              memory: "512Mi"
              cpu: "0.5"

---
apiVersion: v1
kind: Service
metadata:
  name: novel-canary-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: novel-canary 